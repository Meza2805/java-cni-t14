# =====================================================
# Perfil "mysql": conexion a MySQL
# Se activa con:  spring.profiles.active=mysql  (en application.properties)
#             o:  variable de entorno SPRING_PROFILES_ACTIVE=mysql
# Los valores de aqui REEMPLAZAN a los de application.properties (SQLite).
# =====================================================

# --- Conexion ---
# createDatabaseIfNotExist=true: si la base "crud_demo" no existe, MySQL la crea sola
# ${DB_USER:root} = usa la variable de entorno DB_USER; si no existe, usa "root"
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crud_demo}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MySQL si admite varias conexiones a la vez (SQLite no)
spring.datasource.hikari.maximum-pool-size=10

# --- JPA / Hibernate ---
# Dialecto de MySQL: le dice a Hibernate como escribir el SQL para este motor
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
