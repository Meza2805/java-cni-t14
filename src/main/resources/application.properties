spring.application.name=demo

# =====================================================================
#  1) ELEGIR LA BASE DE DATOS
# =====================================================================
# Este archivo SIEMPRE se lee y trae la configuracion de SQLite.
# Si se activa un PERFIL, Spring lee ademas el archivo de ese perfil
# y sus valores REEMPLAZAN a los de SQLite:
#
#   spring.profiles.active=mysql      -> lee application-mysql.properties
#   spring.profiles.active=sqlserver  -> lee application-sqlserver.properties
#   (las dos lineas con #)            -> se queda con SQLite (demo.db)
#
# Deja SOLO UNA linea sin #. Despues de cambiarla, reinicia la app.
# En la consola veras cual quedo activa:
#   The following 1 profile is active: "mysql"
#
# El usuario y la contrasena de MySQL / SQL Server NO van aqui:
# estan en su propio archivo (application-mysql.properties, etc.).
# ---------------------------------------------------------------------
#spring.profiles.active=mysql
#spring.profiles.active=sqlserver

# =====================================================================
#  2) SQLITE (se usa cuando NO hay ningun perfil activo)
# =====================================================================
# SQLite no necesita servidor, usuario ni contrasena: la base es un
# archivo (demo.db) que se crea solo en la carpeta del proyecto.
spring.datasource.url=jdbc:sqlite:demo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite permite un solo escritor a la vez: con una sola conexion
# se evita el error "database is locked"
spring.datasource.hikari.maximum-pool-size=1
# Dialecto: le dice a Hibernate como escribir el SQL para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# =====================================================================
#  3) JPA / HIBERNATE (ORM: Object Relational Mapping)
#     Se aplica a TODAS las bases de datos
# =====================================================================
# update: al arrancar, crea o actualiza las tablas a partir de las
# entidades (@Entity). No borra datos existentes.
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que genera Hibernate (util para aprender)
spring.jpa.show-sql=true
# Imprime ese SQL ordenado en varias lineas, mas facil de leer
spring.jpa.properties.hibernate.format_sql=true
