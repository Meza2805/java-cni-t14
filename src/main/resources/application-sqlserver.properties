# =====================================================
# Perfil "sqlserver": conexion a Microsoft SQL Server
# Se activa con:  spring.profiles.active=sqlserver  (en application.properties)
#             o:  variable de entorno SPRING_PROFILES_ACTIVE=sqlserver
# Los valores de aqui REEMPLAZAN a los de application.properties (SQLite).
#
# IMPORTANTE: SQL Server NO crea la base sola. Antes de arrancar ejecuta:
#   CREATE DATABASE crud_demo;
# =====================================================

# --- Conexion ---
# encrypt=true + trustServerCertificate=true: conexion cifrada aceptando el
# certificado autofirmado de una instalacion local (solo para desarrollo)
# ${DB_USER:sa} = usa la variable de entorno DB_USER; si no existe, usa "sa"
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:crud_demo};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# SQL Server si admite varias conexiones a la vez (SQLite no)
spring.datasource.hikari.maximum-pool-size=10

# --- JPA / Hibernate ---
# Dialecto de SQL Server: le dice a Hibernate como escribir el SQL para este motor
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
