<!DOCTYPE html>
<!--
  =====================================================================
   FRAGMENTOS COMPARTIDOS (layout)
  =====================================================================
   Un fragmento es un trozo de HTML reutilizable. Se define con th:fragment
   y se inserta en otra pagina con th:replace:

     <head th:replace="~{fragments/layout :: head('Categorías')}"></head>

   Asi el <head>, el menu y los <script> se escriben UNA sola vez.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- ===================== 1) <head>: estilos de todas las paginas ===================== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- th:text reemplaza el texto con el titulo que manda cada pagina -->
    <title th:text="${titulo} + ' · CRUD Spring Boot'">Titulo</title>
    <!-- Bootstrap 5: estilos y componentes (botones, tarjetas, modales...) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons: iconos con <i class="bi bi-..."> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- DataTables (tema Bootstrap 5): tablas con buscador, orden y paginacion -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css">
    <!-- @{...} arma la URL correcta dentro de la aplicacion: /css/app.css (src/main/resources/static) -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- ===================== 2) Menu de navegacion ===================== -->
<!-- Recibe "activo" para resaltar la opcion de la pagina actual con th:classappend -->
<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-dark barra">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-database-fill-gear"></i> CRUD Spring Boot</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}"><i class="bi bi-house"></i> Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'categorias'} ? 'active'" th:href="@{/categorias}"><i class="bi bi-tags"></i> Categorías</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'productos'} ? 'active'" th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li>
                <!-- PRACTICA: nueva opcion del menu -->
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'proveedores'} ? 'active'" th:href="@{/proveedores}"><i class="bi bi-truck"></i> Proveedores</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'relaciones'} ? 'active'" th:href="@{/relaciones}"><i class="bi bi-diagram-3"></i> Relaciones</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'reportes'} ? 'active'" th:href="@{/reportes}"><i class="bi bi-file-earmark-arrow-down"></i> Reportes</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===================== 3) Pie de pagina ===================== -->
<footer th:fragment="footer" class="pie text-center">
    Fundamentos de Desarrollo Backend con Java · CI Nicaragua · Temporada XIV
</footer>

<!-- ===================== 4) Librerias JavaScript ===================== -->
<!-- th:block no genera ninguna etiqueta: solo agrupa los <script> -->
<th:block th:fragment="scripts">
    <!-- jQuery: lo necesitan Notify.js y DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap: menu desplegable y ventanas modales -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables: tablas interactivas -->
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
    <!-- SweetAlert2: ventanas de confirmacion y de error -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <!-- Notify.js: notificaciones pequenas en la esquina -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/notify/0.4.2/notify.min.js"></script>
    <!-- Nuestras funciones comunes: notificar(), confirmar(), api()... -->
    <script th:src="@{/js/app.js}"></script>
    <!--
      th:inline="javascript": Thymeleaf escribe valores de Java DENTRO del JavaScript.
      /*[[${ok}]]*/ se reemplaza por el mensaje "flash" que mando el controller
      (por ejemplo "Categoria creada"), o por null si no hay mensaje.
    -->
    <script th:inline="javascript">
        const mensajeOk = /*[[${ok}]]*/ null;
        const mensajeError = /*[[${error}]]*/ null;
        if (mensajeOk) notificar(mensajeOk, 'success');
        if (mensajeError) notificar(mensajeError, 'error');
    </script>
</th:block>

</body>
</html>
