<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-3 gap-2">
        <div>
            <p class="eyebrow mb-1">// Thymeleaf clásico · Model + formulario HTML</p>
            <h1 class="titulo mb-0">Categorías</h1>
        </div>
        <span class="endpoint">GET /categorias · POST /categorias/guardar</span>
    </div>

    <div class="row g-4">
        <!-- ===================== FORMULARIO ===================== -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <!-- th:text con operador ternario: el titulo cambia si estamos editando -->
                <div class="card-header fw-bold"
                     th:text="${categoria.id == null} ? 'Nueva categoría' : 'Editar categoría'">Nueva categoría</div>
                <div class="card-body">
                    <!--
                      th:object="${categoria}": el formulario trabaja con ese objeto.
                      th:field="*{nombre}": genera id, name="nombre" y value con el dato actual.
                      *{...} = "atributo del th:object".
                      th:action="@{/categorias/guardar}": a donde se envia (POST).
                    -->
                    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" for="nombre">Nombre</label>
                            <!-- th:errorclass agrega "is-invalid" si el campo tiene error -->
                            <input class="form-control" th:field="*{nombre}" th:errorclass="is-invalid" maxlength="50">
                            <!-- th:errors muestra el mensaje de @NotBlank / @Size / duplicado -->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="descripcion">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" th:errorclass="is-invalid" rows="3" maxlength="200"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">Error</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                            <!-- th:if: este boton solo aparece al editar -->
                            <a th:if="${categoria.id != null}" th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ===================== TABLA ===================== -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table id="tablaCategorias" class="table table-striped align-middle w-100">
                        <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Productos</th><th class="text-end">Acciones</th></tr>
                        </thead>
                        <tbody>
                        <!-- th:each: repite la fila <tr> por cada categoria de la lista -->
                        <tr th:each="c : ${categorias}">
                            <td th:text="${c.id}">1</td>
                            <td class="fw-semibold" th:text="${c.nombre}">Nombre</td>
                            <!-- ?: (Elvis): si la descripcion es null, muestra un guion -->
                            <td th:text="${c.descripcion} ?: '-'">Descripción</td>
                            <!-- c.productos viene cargado por LEFT JOIN FETCH: no hay consultas extra -->
                            <td><span class="badge text-bg-secondary" th:text="${c.productos.size()}">0</span></td>
                            <td class="text-end text-nowrap">
                                <!-- @{/categorias/{id}/editar(id=${c.id})} arma /categorias/3/editar -->
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/categorias/{id}/editar(id=${c.id})}" title="Editar"><i class="bi bi-pencil"></i></a>
                                <!-- Eliminar: formulario POST. data-confirmar hace que app.js pregunte con SweetAlert2 -->
                                <form class="d-inline" th:action="@{/categorias/{id}/eliminar(id=${c.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"
                                            th:attr="data-confirmar=|¿Eliminar la categoría ${c.nombre}?|"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // DataTables sobre una tabla que ya armo Thymeleaf en el servidor:
    // le agrega buscador, orden por columnas y paginacion.
    new DataTable('#tablaCategorias', {
        language: DT_ES,                                    // Textos en espanol (app.js)
        columnDefs: [{ targets: -1, orderable: false }]     // La columna de acciones no se ordena
    });
</script>
</body>
</html>
