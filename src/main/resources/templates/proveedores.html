<!DOCTYPE html>
<!-- PRACTICA: copia de categorias.html, cambiando categoria por proveedor -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proveedores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('proveedores')}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-3 gap-2">
        <div>
            <p class="eyebrow mb-1">// Práctica · Thymeleaf clásico</p>
            <h1 class="titulo mb-0">Proveedores</h1>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <span class="endpoint">GET /proveedores · POST /proveedores/guardar</span>
            <a class="btn btn-danger" th:href="@{/reportes/proveedores.pdf}"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
        </div>
    </div>

    <div class="row g-4">
        <!-- ===================== FORMULARIO ===================== -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header fw-bold"
                     th:text="${proveedor.id == null} ? 'Nuevo proveedor' : 'Editar proveedor'">Nuevo proveedor</div>
                <div class="card-body">
                    <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input class="form-control" th:field="*{nombre}" th:errorclass="is-invalid" maxlength="80">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="telefono">Teléfono</label>
                            <input class="form-control" th:field="*{telefono}" th:errorclass="is-invalid" maxlength="20">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">Error</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                            <a th:if="${proveedor.id != null}" th:href="@{/proveedores}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ===================== TABLA ===================== -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table id="tablaProveedores" class="table table-striped align-middle w-100">
                        <thead>
                        <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Productos</th><th class="text-end">Acciones</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${proveedores}">
                            <td th:text="${p.id}">1</td>
                            <td class="fw-semibold" th:text="${p.nombre}">Nombre</td>
                            <td th:text="${p.email}">correo</td>
                            <td th:text="${p.telefono} ?: '-'">telefono</td>
                            <td><span class="badge text-bg-secondary" th:text="${p.productos.size()}">0</span></td>
                            <td class="text-end text-nowrap">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/proveedores/{id}/editar(id=${p.id})}" title="Editar"><i class="bi bi-pencil"></i></a>
                                <form class="d-inline" th:action="@{/proveedores/{id}/eliminar(id=${p.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar"
                                            th:attr="data-confirmar=|¿Eliminar el proveedor ${p.nombre}?|"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    new DataTable('#tablaProveedores', {
        language: DT_ES,
        columnDefs: [{ targets: -1, orderable: false }]
    });
</script>
</body>
</html>
