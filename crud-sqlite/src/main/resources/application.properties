spring.application.name=demo

# --- SQLite ---
# El archivo demo.db se crea solo en la carpeta desde donde se ejecuta la app
spring.datasource.url=jdbc:sqlite:demo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor a la vez: una conexion evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# --- JPA / Hibernate --- ORM -Objeto Relacional Mapping
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# update: crea/actualiza la tabla a partir de la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
