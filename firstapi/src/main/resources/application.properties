# =============================================================================
#  application.properties · Configuración de la aplicación
# -----------------------------------------------------------------------------
#  Spring Boot lee este archivo al arrancar. Cada línea es "clave=valor".
#  Las líneas que empiezan con # son comentarios.
# =============================================================================

# Nombre de la aplicación (aparece en los logs)
spring.application.name=firstapi

# Puerto donde escucha la API -> http://localhost:8080
server.port=8080

# -----------------------------------------------------------------------------
#  Base de datos H2 (en memoria)
# -----------------------------------------------------------------------------
# "mem" = los datos viven en la RAM y se borran al detener la aplicación.
spring.datasource.url=jdbc:h2:mem:firstapi
spring.datasource.username=sa
spring.datasource.password=

# Habilita la consola web de H2 -> http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:firstapi · Usuario: sa · Contraseña: vacía)
spring.h2.console.enabled=true
